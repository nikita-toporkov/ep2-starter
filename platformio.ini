; Embedded Programming 2 — starter project
; ESP32-S3-DevKitC-1 (WROOM-2 module: octal flash + octal PSRAM)
; Arduino framework · PlatformIO

[env:esp32-s3-devkitc-1]
; Pinned on purpose: this version ships Arduino-ESP32 core 2.0.17, which is what
; the course material is written and tested against. Leaving it unpinned means a
; student who installs later in the semester can get a different core and hit
; different behaviour (e.g. the RGB-LED helpers were renamed in core 3).
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ── Octal (OPI) flash + PSRAM — REQUIRED on our boards ───────────────────
; Our modules have octal flash. The stock board definition assumes quad ("qio"),
; and a quad-built image panics at boot on this hardware with:
;     assert failed: do_core_init startup.c:328 (flash_ret == ESP_OK)
; The boot log gives it away: "Octal Flash Mode Enabled".
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi

build_flags =
	-D BOARD_HAS_PSRAM             ; 8 MB PSRAM — headroom for TinyML later
	-D ARDUINO_USB_CDC_ON_BOOT=0   ; Serial -> the UART port (see note below)

lib_deps =
	adafruit/Adafruit MPU6050 @ ^2.2.6
	fastled/FastLED @ ^3.6.0

; ── Which USB port? ──────────────────────────────────────────────────────
; The board has two USB-C sockets:
;   UART — goes through a USB-to-serial bridge chip.  <-- use this one
;   USB  — the ESP32-S3's own native USB.
; We use UART because it keeps working when your program crashes or reboots
; (native USB vanishes with it), and esptool/flashing is more reliable on it.
; With ARDUINO_USB_CDC_ON_BOOT=0 above, Serial.print() comes out of this port,
; so uploading and the serial monitor both use the same cable.
;
; If you ever want to use the native USB socket instead, set that flag to 1
; and plug into the port marked USB.
;
; ── When you deploy an Edge Impulse model (session 4) ────────────────────
; Unzip the exported "Arduino library" into lib/. If headers don't resolve,
; add:  lib_ldf_mode = deep+
